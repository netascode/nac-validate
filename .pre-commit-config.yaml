repos:
  - repo: local
    hooks:
      - id: license-headers
        name: Check license headers
        entry: ./scripts/license-headers.sh
        language: script
        types: [python]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ['-r', 'nac_validate/']
        exclude: ^tests/
