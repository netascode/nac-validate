# Actions are pinned to commit SHAs (not version tags) to prevent supply chain attacks.
# Version comments (e.g., "# v7") allow Dependabot to track and update to newer versions.
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

      - name: Check tag matches project version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(uv version --short)
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match pyproject.toml version $VERSION"
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Take the body of the "## <version>" section, up to the next "## " heading.
          # Fails here, before anything is published, if the section is missing,
          # still marked "unreleased" or empty.
          VERSION="${TAG#v}"
          rc=0
          notes=$(awk -v v="$VERSION" '
            /^## / {
              if (found) exit
              h = $2
              gsub(/[][]/, "", h)
              if (h == v) {
                found = 1
                if (tolower($0) ~ /unreleased/) unreleased = 1
              }
              next
            }
            found { print }
            END {
              if (!found) exit 2
              if (unreleased) exit 3
            }
          ' CHANGELOG.md) || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::error::No '## $VERSION' section found in CHANGELOG.md"
            exit 1
          elif [ "$rc" -eq 3 ]; then
            echo "::error::CHANGELOG.md section for $VERSION is still marked unreleased"
            exit 1
          elif [ "$rc" -ne 0 ]; then
            echo "::error::Failed to read CHANGELOG.md"
            exit 1
          fi
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md section for $VERSION is empty"
            exit 1
          fi
          printf '%s\n' "$notes" > release-notes.md

      - name: Build
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - name: Upload release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  # Publishing is a separate job so that only it can mint the OIDC token PyPI
  # trusts; the build step above never has access to it.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write  # Required for PyPI trusted publishing
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create the release
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-notes

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # Versions with a letter (e.g. 1.0.0rc1) are marked as pre-releases
          PRERELEASE=""
          if [[ "${TAG#v}" =~ [a-zA-Z] ]]; then
            PRERELEASE="--prerelease"
          fi
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "$TAG" \
            --notes-file release-notes.md \
            $PRERELEASE
