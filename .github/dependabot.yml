# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
    cooldown:
      default-days: 3

  # Native uv support updates pyproject.toml and uv.lock in the same pull request
  - package-ecosystem: 'uv'
    directory: '/'
    schedule:
      interval: 'daily'
    allow:
      - dependency-type: 'all'
    cooldown:
      default-days: 3
      # Maintained by us, so new releases are picked up right away
      exclude:
        - 'nac-artifacts'
        - 'nac-yaml'
